name: 4️⃣ Text Content → Đăng Page

on:
  workflow_dispatch:
    inputs:
      Prompt_Name:
        description: "Chọn bộ Prompt"
        required: true
        default: nam
        type: choice
        options:
          - nam
          - khương
      overwrite:
        description: "Ghi đè Text_Content đã có"
        required: false
        default: false
        type: boolean
      text_limit:
        description: "Text Content: số sản phẩm tối đa; để trống = tất cả"
        required: false
        type: string
      publish_limit:
        description: "Đăng Page: số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  text_content:
    name: 1️⃣ Tạo Text Content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_MAX_WORKERS: "3"
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements-text-content.txt
      - name: Cài thư viện Text Content
        run: pip install --disable-pip-version-check -r requirements-text-content.txt
      - name: Tạo Text Content
        shell: bash
        run: |
          args=()
          args+=(--prompt-name "${{ inputs.Prompt_Name }}")
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then args+=(--overwrite); fi
          if [[ -n "${{ inputs.text_limit }}" ]]; then args+=(--limit "${{ inputs.text_limit }}"); fi
          python -m src.text_content_generator "${args[@]}"

  publish_page:
    name: 2️⃣ Đăng Facebook Page
    needs: text_content
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Bài viết"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Đăng bài lên Facebook Page
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.publish_limit }}" ]]; then
            args+=(--limit "${{ inputs.publish_limit }}")
          fi
          python run.py "${args[@]}"
