name: 1️⃣1️⃣ Quét kho link video Telegram

on:
  workflow_dispatch:
    inputs:
      max_messages_per_chat:
        description: "Giới hạn số tin nhắn quét mỗi nhóm/kênh; để trống = toàn bộ lịch sử"
        required: false
        type: string

concurrency:
  group: mydu-telegram-video-inventory
  cancel-in-progress: false

jobs:
  scan_telegram:
    name: Quét video Telegram vào Kho link video tele
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Kho link video tele"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram_video_inventory/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r telegram_video_inventory/requirements.txt

      - name: Quét nhóm và kênh Telegram
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.max_messages_per_chat }}" ]]; then
            args+=(--max-messages-per-chat "${{ inputs.max_messages_per_chat }}")
          fi
          python telegram_video_inventory/run.py "${args[@]}"
