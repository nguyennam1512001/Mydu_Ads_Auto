name: 1️⃣1️⃣ Quét kho link video Telegram

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Quét video từ ngày này trở đi, định dạng d/m/yyyy (ví dụ 6/9/2026)"
        required: true
        default: "6/9/2026"
        type: string

concurrency:
  group: mydu-telegram-video-inventory
  cancel-in-progress: false

jobs:
  scan_telegram:
    name: Quét video Telegram vào Kho link video tele
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Kho link video tele"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram_video_inventory/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r telegram_video_inventory/requirements.txt

      - name: Quét nhóm và kênh Telegram
        run: python telegram_video_inventory/run.py --start-date "${{ inputs.start_date }}"
