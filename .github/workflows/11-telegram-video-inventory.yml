name: 11. Quét kho link video Telegram

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Quét video từ ngày này trở đi, định dạng d/m/yyyy; để trống = không giới hạn ngày"
        required: false
        type: string
      telegram_groups:
        description: "Nhóm/kênh Telegram cần quét; có thể xuống dòng hoặc cách nhau bằng dấu phẩy; để trống = tất cả nhóm/kênh"
        required: false
        type: string
      codes:
        description: "Danh sách mã cần quét; có thể xuống dòng, cách nhau bằng dấu phẩy hoặc khoảng trắng"
        required: false
        type: string
      latest_per_code:
        description: "Số video mới nhất cần lấy cho mỗi mã; để trống = lấy tất cả"
        required: false
        type: string

concurrency:
  group: mydu-telegram-video-inventory
  cancel-in-progress: false

jobs:
  scan_telegram:
    name: Quét video Telegram vào Kho link video tele
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Kho link video tele"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      START_DATE: ${{ inputs.start_date }}
      TELEGRAM_GROUPS: ${{ inputs.telegram_groups }}
      TARGET_CODES: ${{ inputs.codes }}
      LATEST_PER_CODE: ${{ inputs.latest_per_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram_video_inventory/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r telegram_video_inventory/requirements.txt

      - name: Quét nhóm và kênh Telegram
        shell: bash
        run: |
          args=()
          if [[ -n "$START_DATE" ]]; then
            args+=(--start-date "$START_DATE")
          fi
          if [[ -n "$TELEGRAM_GROUPS" ]]; then
            args+=(--telegram-groups "$TELEGRAM_GROUPS")
          fi
          if [[ -n "$TARGET_CODES" ]]; then
            args+=(--codes "$TARGET_CODES")
          fi
          if [[ -n "$LATEST_PER_CODE" ]]; then
            args+=(--latest-per-code "$LATEST_PER_CODE")
          fi
          python telegram_video_inventory/run.py "${args[@]}"
