name: 5️⃣ Đăng Page → Tạo Campaign

on:
  workflow_dispatch:
    inputs:
      publish_limit:
        description: "Đăng Page: số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  publish_page:
    name: 1️⃣ Đăng Facebook Page
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Bài viết"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Đăng bài lên Facebook Page
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.publish_limit }}" ]]; then
            args+=(--limit "${{ inputs.publish_limit }}")
          fi
          python run.py "${args[@]}"

  create_campaign:
    name: 2️⃣ Tạo Campaign
    needs: publish_page
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Lên Camp"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    defaults:
      run:
        working-directory: create_campaign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: create_campaign/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Tạo Campaign/AdSet/Ad từ Google Sheet
        run: python run.py --from-sheet
