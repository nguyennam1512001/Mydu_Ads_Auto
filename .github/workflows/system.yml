name: 🚀 Chạy hệ thống

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Chọn chức năng cần chạy"
        required: true
        default: "Tạo Text Content"
        type: choice
        options:
          - "Tạo Text Content"
          - "Đăng Facebook Page"
          - "Tạo Campaign"
          - "Tạo Text Content -> Đăng Facebook Page"
          - "Đăng Facebook Page -> Tạo Campaign"
          - "Chạy toàn bộ"
      Prompt_Name:
        description: "Bộ Prompt dùng khi có bước Tạo Text Content"
        required: true
        default: nam
        type: choice
        options:
          - nam
          - khương
      dry_run:
        description: "Text Content: chạy thử, không gọi AI và không ghi Sheet"
        required: false
        default: true
        type: boolean
      overwrite:
        description: "Text Content: ghi đè Text_Content đã có"
        required: false
        default: false
        type: boolean
      text_limit:
        description: "Text Content: số sản phẩm tối đa; để trống = tất cả"
        required: false
        type: string
      publish_limit:
        description: "Đăng Page: số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  text_content:
    name: 1️⃣ Tạo Text Content
    if: >-
      ${{
        inputs.run_mode == 'Tạo Text Content' ||
        inputs.run_mode == 'Tạo Text Content -> Đăng Facebook Page' ||
        inputs.run_mode == 'Chạy toàn bộ'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_MAX_WORKERS: "3"
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements-text-content.txt

      - name: Cài thư viện Text Content
        run: pip install --disable-pip-version-check -r requirements-text-content.txt

      - name: Tạo Text Content
        shell: bash
        run: |
          args=()
          args+=(--prompt-name "${{ inputs.Prompt_Name }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then args+=(--overwrite); fi
          if [[ -n "${{ inputs.text_limit }}" ]]; then args+=(--limit "${{ inputs.text_limit }}"); fi
          python -m src.text_content_generator "${args[@]}"

  publish_page:
    name: 2️⃣ Đăng Facebook Page
    needs: text_content
    if: >-
      ${{
        always() &&
        (
          inputs.run_mode == 'Đăng Facebook Page' ||
          inputs.run_mode == 'Đăng Facebook Page -> Tạo Campaign' ||
          (
            (inputs.run_mode == 'Tạo Text Content -> Đăng Facebook Page' || inputs.run_mode == 'Chạy toàn bộ') &&
            needs.text_content.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Đăng bài lên Facebook Page
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.publish_limit }}" ]]; then
            args+=(--limit "${{ inputs.publish_limit }}")
          fi
          python run.py "${args[@]}"

  create_campaign:
    name: 3️⃣ Tạo Campaign
    needs:
      - text_content
      - publish_page
    if: >-
      ${{
        always() &&
        (
          inputs.run_mode == 'Tạo Campaign' ||
          (
            (inputs.run_mode == 'Đăng Facebook Page -> Tạo Campaign' || inputs.run_mode == 'Chạy toàn bộ') &&
            needs.publish_page.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    defaults:
      run:
        working-directory: create_campaign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: create_campaign/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Tạo Campaign/AdSet/Ad từ Google Sheet
        run: python run.py --from-sheet
