name: 1️⃣ Tạo Text Content

on:
  workflow_dispatch:
    inputs:
      Prompt_Name:
        description: "Chọn bộ Prompt"
        required: true
        default: nam
        type: choice
        options:
          - nam
          - khương
      dry_run:
        description: "Chạy thử, không gọi AI và không ghi Sheet"
        required: false
        default: true
        type: boolean
      overwrite:
        description: "Ghi đè Text_Content đã có"
        required: false
        default: false
        type: boolean
      text_limit:
        description: "Số sản phẩm tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  text_content:
    name: Tạo Text Content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_MAX_WORKERS: "3"
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements-text-content.txt
      - name: Cài thư viện Text Content
        run: pip install --disable-pip-version-check -r requirements-text-content.txt
      - name: Tạo Text Content
        shell: bash
        run: |
          args=()
          args+=(--prompt-name "${{ inputs.Prompt_Name }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then args+=(--overwrite); fi
          if [[ -n "${{ inputs.text_limit }}" ]]; then args+=(--limit "${{ inputs.text_limit }}"); fi
          python -m src.text_content_generator "${args[@]}"
