name: 🔟 Lấy Preview image

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số dòng tối đa; để trống = tất cả"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mydu-preview-image-only
  cancel-in-progress: false

jobs:
  preview_image:
    name: Lấy Preview image từ Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Bài viết"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_DRIVE_PREVIEW_FOLDER_ID: "1BmaIqYaxcbGUyYr1tNaBPmkRhUuMvfRP"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: preview_image/requirements.txt

      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r preview_image/requirements.txt

      - name: Lấy thumbnail và upload lên Google Drive
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.limit }}" ]]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          python preview_image/run.py download "${args[@]}"

      - name: Ghi Preview_Image vào Google Sheet
        run: python preview_image/run.py apply
