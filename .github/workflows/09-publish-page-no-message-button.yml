name: 9️⃣ Đăng Facebook Page ko có nút gửi tin nhắn

on:
  workflow_dispatch:
    inputs:
      publish_limit:
        description: "Số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  publish_page:
    name: Đăng Facebook Page ko có nút gửi tin nhắn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Bài viết"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Đăng bài lên Facebook Page ko có nút gửi tin nhắn
        shell: bash
        run: |
          args=(--no-message-button)
          if [[ -n "${{ inputs.publish_limit }}" ]]; then
            args+=(--limit "${{ inputs.publish_limit }}")
          fi
          python run.py "${args[@]}"

