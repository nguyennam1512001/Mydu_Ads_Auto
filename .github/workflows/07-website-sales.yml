name: 06. Tạo Campaign Doanh số Website

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  website_sales:
    name: Tạo Campaign Doanh số Website
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Lên Camp"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
    defaults:
      run:
        working-directory: create_campaign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: create_campaign/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Cho phép trùng Mã trong tab Bài viết
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sheet_client.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if code in assets:\n            raise ValueError(\n                f"Mã '{code}' bị trùng trong tab '{worksheet.title}' "\n                f"(phát hiện tại hàng {row_number})"\n            )\n'''
          if old in text:
              text = text.replace(old, "", 1)
              path.write_text(text, encoding="utf-8")
              print("Đã bỏ kiểm tra trùng Mã cho Workflow 6.")
          else:
              print("Không tìm thấy block kiểm tra trùng Mã; tiếp tục chạy.")
          PY
      - name: Tạo quảng cáo doanh số Website
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.limit }}" ]]; then args+=(--limit "${{ inputs.limit }}"); fi
          python -m src.website_sales "${args[@]}"
