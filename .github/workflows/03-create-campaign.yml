name: 3️⃣ Tạo Campaign

on:
  workflow_dispatch:

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  create_campaign:
    name: Tạo Campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Lên Camp"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    defaults:
      run:
        working-directory: create_campaign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: create_campaign/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Tạo Campaign/AdSet/Ad từ Google Sheet
        run: python run.py --from-sheet
