name: 07. Lấy Image Hash

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số dòng tối đa; để trống = tất cả"
        required: false
        type: string
      source:
        description: "Nguồn thumbnail"
        required: true
        default: "fb_upload_id"
        type: choice
        options:
          - fb_upload_id
          - thumbdownloader

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  get_image_hash:
    name: Lấy Image Hash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      OAuth_Google: ${{ secrets.OAuth_Google }}
      GOOGLE_DRIVE_PREVIEW_FOLDER_ID: "1BmaIqYaxcbGUyYr1tNaBPmkRhUuMvfRP"
    defaults:
      run:
        working-directory: post_page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: post_page/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Cài Chromium cho ThumbDownloader
        run: python -m playwright install --with-deps chromium
      - name: Lấy Image Hash
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.limit }}" ]]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          args+=(--source "${{ inputs.source }}")
          python -m src.image_hash_cli "${args[@]}"
