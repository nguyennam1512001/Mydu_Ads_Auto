name: Bootstrap - Gộp 2 repo nguồn

on:
  push:
    paths:
      - ".github/workflows/bootstrap-merge.yml"

permissions:
  contents: write

jobs:
  merge-source-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo đích
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone 2 repo nguồn
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Auto_Post_Page /tmp/Auto_Create_Campain
          git clone --depth 1 https://github.com/nguyennam1512001/Auto_Post_Page.git /tmp/Auto_Post_Page
          git clone --depth 1 https://github.com/nguyennam1512001/Auto_Create_Campain.git /tmp/Auto_Create_Campain

      - name: Gộp code vào thư mục riêng
        shell: bash
        run: |
          set -euo pipefail
          rm -rf post_page create_campaign
          mkdir -p post_page create_campaign

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/Auto_Post_Page/ post_page/

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/Auto_Create_Campain/ create_campaign/

      - name: Commit code đã gộp
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_page create_campaign

          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi

          git commit -m "Merge Auto_Post_Page and Auto_Create_Campain"
          git push origin HEAD:main
