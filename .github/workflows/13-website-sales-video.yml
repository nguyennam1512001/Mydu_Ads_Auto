name: 13. Tạo Campaign Doanh số Website từ FB_UPLOAD_ID

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số dòng tối đa; để trống = tất cả"
        required: false
        type: string

concurrency:
  group: mydu-ads-auto-system
  cancel-in-progress: false

jobs:
  website_sales_video:
    name: Tạo Campaign Website từ video có sẵn
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: "Lên Camp"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    defaults:
      run:
        working-directory: create_campaign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: create_campaign/requirements.txt
      - name: Cài thư viện
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Tạo quảng cáo doanh số Website từ FB_UPLOAD_ID
        shell: bash
        env:
          ROW_LIMIT: ${{ inputs.limit }}
        run: |
          args=(--source fb_upload_id)
          if [[ -n "$ROW_LIMIT" ]]; then args+=(--limit "$ROW_LIMIT"); fi
          python -u -m src.website_sales "${args[@]}"

